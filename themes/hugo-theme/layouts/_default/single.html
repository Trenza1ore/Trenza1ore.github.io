{{ define "header" }}
{{ partial "header.html" . }}
{{ end }}

{{ define "main" }}
<article class="blog-post">
    <div class="container">
        <header class="post-header">
            <h1 class="post-title">{{ .Title }}</h1>
            {{ if .Date }}
            <div class="post-meta">
                <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            </div>
            {{ end }}
        </header>

        <div class="post-content">
            {{ .Content }}
        </div>
    </div>
</article>
{{ end }}

{{ define "footer" }}
{{ partial "footer.html" . }}
{{ end }}
